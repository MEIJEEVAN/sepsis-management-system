[project]
name = "sepsis-backend"
version = "0.1.0"
description = "Sepsis Management System backend"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-jwt-extended>=4.6",
    "flask-cors>=4.0",
    "flask-migrate>=4.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "marshmallow>=4.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["ruff", "black", "pytest"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
